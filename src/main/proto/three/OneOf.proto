syntax = "proto3";

package three;
option java_multiple_files = true;
option java_package = "com.learn.grpc.three";

message Phone{
  int32 number=1;
  int32 code=2;
}

message Email{
  string address = 1;
  string password = 2;
}

// any one of the type should be given, if both given last assigned value will be present
message Credential{
  oneof type{
    Phone phone = 1;
    Email email = 2;
  }
}